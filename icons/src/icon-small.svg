<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Dedicated 16px drawing. The card overlap, gradient and rim of the large
       icon are invisible or muddy at this size, so this is flat and single-card:
       one solid coral tile, one white sheet, three rules. Classic and legible in
       a tab strip on any theme. -->
  <rect width="16" height="16" rx="3.5" fill="#E9573C"/>
  <rect x="3" y="2.5" width="10" height="11" rx="2" fill="#FFFFFF"/>
  <g fill="#E9573C">
    <rect x="4.8" y="4.8" width="6.4" height="1.3" rx="0.65"/>
    <rect x="4.8" y="7.2" width="6.4" height="1.3" rx="0.65"/>
    <rect x="4.8" y="9.6" width="4" height="1.3" rx="0.65"/>
  </g>
</svg>
