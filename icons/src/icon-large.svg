<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 128px and 48px.
       The universal copy glyph: two overlapping rounded squares, outlined, with
       no interior detail. Interior lines are what destroy legibility at a
       distance, so there are none.

       Off-white on near-black gives roughly 17:1 contrast. The luminous rim
       stops the tile merging into a dark browser toolbar.

       The twist: the back square is a frosted glass panel rather than a plain
       outline. That is where the depth comes from — no blurs, no noise, nothing
       that turns to mud when downscaled. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23272C"/>
      <stop offset="0.55" stop-color="#121518"/>
      <stop offset="1" stop-color="#0B0D0E"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F6F0" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#F7F6F0" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="tileClip"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="128" height="128" fill="url(#tile)"/>
    <rect width="128" height="60" fill="url(#sheen)"/>
  </g>
  <rect x="1.25" y="1.25" width="125.5" height="125.5" rx="26.75" fill="none"
        stroke="#F7F6F0" stroke-opacity="0.22" stroke-width="2.5"/>

  <!-- back square: frosted panel -->
  <rect x="30" y="25" width="50" height="50" rx="12"
        fill="url(#frost)" stroke="#F7F6F0" stroke-opacity="0.52" stroke-width="6"/>

  <!-- front square: crisp, filled with the tile colour so it occludes cleanly -->
  <rect x="48" y="53" width="50" height="50" rx="12"
        fill="#0B0D0E" stroke="#F7F6F0" stroke-width="7"/>
</svg>
