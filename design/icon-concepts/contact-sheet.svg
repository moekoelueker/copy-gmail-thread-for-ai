<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1120" viewBox="0 0 1600 1120">
  <rect width="1600" height="1120" fill="#f4f1ea"/>
  <text x="80" y="76" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#17191c">Copy Gmail Thread for AI — icon directions</text>
