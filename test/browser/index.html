<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DOM tests</title>
  </head>
  <body>
    <div id="out">running</div>

    <script>
      const V = "?v=" + Date.now();
      for (const m of [
        "lib/text",
        "lib/security",
        "lib/richtext",
        "lib/clean",
        "lib/format",
        "lib/attachments",
        "adapters/gmail-parse",
        "adapters/gmail",
      ]) {
        document.write('<script src="../../' + m + '.js' + V + '"><\/script>');
      }
    </script>
    <script>
      const results = [];
      const CONTEXT = { threadId: "THREAD_REAL", accountIndex: "0" };

      function frag(html) {
        const d = document.createElement("div");
        d.innerHTML = html; // test scaffolding only
        return d;
      }

      const md = (html) => CT.richtext.toMarkdown(frag(html));

      function check(name, actual, expected) {
        const ok = typeof expected === "function" ? expected(actual) : actual === expected;
        results.push({ name, ok, actual });
      }

      // Links are useful, but destinations and Markdown grammar are untrusted.
      check("link becomes markdown", md('<a href="https://ex.com/a">Docs</a>'), "[Docs](https://ex.com/a)");
      check(
        "gmail redirect is unwrapped",
        md('<a href="https://www.google.com/url?q=https%3A%2F%2Fex.com%2Fa&amp;sa=D">Docs</a>'),
        "[Docs](https://ex.com/a)"
      );
      check("javascript href is dropped", md('<a href="javascript:alert(1)">Click</a>'), "Click");
      check("scheme-only pseudo-HTTPS is dropped", md('<a href="https:evil">Click</a>'), "Click");
      check(
        "bare URL punctuation is encoded without double wrapping",
        md('<a href="https://ex.com/a_(b)">https://ex.com/a_(b)</a>'),
        "https://ex.com/a_%28b%29"
      );
      check(
        "markdown punctuation cannot break a link",
        md('<a href="https://ex.com/a_(b)">[Docs]</a>'),
        "[\\[Docs\\]](https://ex.com/a_%28b%29)"
      );

      // Remote images are described but never emitted as active Markdown.
      check(
        "base64 image is never inlined",
        md('<img alt="logo" src="data:image/png;base64,AAAA">'),
        "[inline image: logo]"
      );
      check("remote image is inert", md('<img alt="x" src="https://ex.com/i.png">'), "[image: x]");
      check("tracking pixel is dropped", md('<img width="1" height="1" src="https://x.com/p.gif">'), "");
      check(
        "open-log pixel is dropped",
        md('<img src="https://ci3.googleusercontent.com/meips/A=s0#https://facebook.com/email_open_log_pic.php">'),
        ""
      );

      // Data tables survive; email layout tables do not become pipe noise.
      check(
        "spacer table produces nothing",
        md("<table><tr><td></td><td></td></tr><tr><td></td><td></td></tr></table>"),
        ""
      );
      check(
        "data table becomes markdown",
        md("<table><tr><th>Item</th><th>Cost</th></tr><tr><td>Seat</td><td>$10</td></tr></table>"),
        (a) => a.includes("| Item | Cost |") && a.includes("| Seat | $10 |")
      );
      check(
        "pipes inside cells are escaped",
        md("<table><tr><td>a|b</td><td>c</td></tr><tr><td>d</td><td>e</td></tr></table>"),
        (a) => a.includes("a\\|b")
      );

      check(
        "nested list is indented",
        md("<ul><li>outer<ul><li>inner</li></ul></li></ul>"),
        (a) => /\n\s{2,}- inner/.test(a)
      );
      check("bold", md("<b>hi</b>"), "**hi**");
      check("italic", md("<i>hi</i>"), "*hi*");
      check(
        "code fence grows past body backticks",
        md("<pre>before\n```\nafter</pre>"),
        (a) => a.startsWith("````") && a.endsWith("````")
      );
      check(
        "inline code grows past body backticks",
        md("<code>a`b</code>"),
        "``a`b``"
      );
      check("script content is dropped", md("<div>keep<script>bad()<\/script></div>"), "keep");

      function stripped(html) {
        const d = frag(html);
        CT.clean.stripQuoteNodes(d);
        return CT.richtext.toMarkdown(d);
      }

      check(
        "ordinary Gmail quote is removed",
        stripped('<div>Reply text<blockquote class="gmail_quote">old stuff</blockquote></div>'),
        "Reply text"
      );
      check(
        "Outlook tail is removed",
        stripped('<div>Reply text</div><div id="appendonsend"></div><div>quoted history</div>'),
        "Reply text"
      );
      check(
        "an inline answer among literal quote lines is preserved",
        stripped(
          '<blockquote class="gmail_quote">&gt; First question<br>' +
            "This is a substantial inline answer that must remain because it contains the sender's actual response and decision.<br>" +
            "&gt; Second question</blockquote>"
        ),
        (a) => a.includes("substantial inline answer")
      );
      check(
        "an answer outside a nested quote is preserved",
        stripped(
          '<div class="gmail_quote"><div class="gmail_attr">On Tue, Jane wrote:</div>' +
            "<blockquote>Old quoted question</blockquote>" +
            "<div>This is a substantial point-by-point answer outside the nested quotation, and deleting it would change the decision.</div></div>"
        ),
        (a) => a.includes("substantial point-by-point answer") && !a.includes("Old quoted question")
      );

      // Print-view attachment parsing: exact origin, account, thread and endpoint.
      const ATTACH_HTML =
        '<div>See attached.<table><tr>' +
        '<td><img src="https://ssl.gstatic.com/ui/v1/icons/mail/images/pdf.gif"></td><td></td>' +
        '<td><a href="/mail/u/0/?view=att&amp;th=THREAD_REAL&amp;attid=0.1"><b>Contract.pdf</b></a> 153K</td>' +
        "</tr></table></div>";

      (function () {
        const d = frag(ATTACH_HTML);
        const found = CT.adapter.extractAttachments(d, CONTEXT);
        check("attachment name extracted", found.attachments[0]?.name, "Contract.pdf");
        check("attachment size extracted", found.attachments[0]?.size, "153K");
        check("verified attachment parse is complete", found.complete, true);
        check("attachment markup removed from body", CT.richtext.toMarkdown(d), "See attached.");
      })();

      (function () {
        const holder = document.createElement("div");
        holder.innerHTML =
          '<h2 class="hP" aria-hidden="true">Stale</h2><h2 class="hP">Current</h2>';
        document.body.appendChild(holder);
        check("hidden stale subject is ignored", CT.adapter.subjectElement()?.textContent, "Current");
        holder.querySelector("h2").removeAttribute("aria-hidden");
        check("two visible subjects fail closed", CT.adapter.subjectElement(), null);
        holder.remove();
      })();

      (function () {
        const d = frag(
          '<div>Keep <a href="https://evil.example/?view=att&amp;th=THREAD_REAL&amp;attid=1"><b>trap.txt</b></a></div>'
        );
        const found = CT.adapter.extractAttachments(d, CONTEXT);
        check("off-origin attachment-looking link is not extracted", found.attachments.length, 0);
        check("off-origin link remains ordinary body content", CT.richtext.toMarkdown(d).includes("trap.txt"), true);
      })();

      (function () {
        const d = frag(
          '<div>Text.<table><tr><td><img src="https://ssl.gstatic.com/ui/v1/icons/mail/images/pdf.gif"></td>' +
            "<td><b>Offline.pdf</b> 12K</td></tr></table></div>"
        );
        const found = CT.adapter.extractAttachments(d, CONTEXT);
        check("icon-only attachment metadata is retained", found.attachments[0]?.name, "Offline.pdf");
        check("missing attachment link marks parse incomplete", found.complete, false);
      })();

      (function () {
        const d = frag(
          '<div>Text.<table><tr><td><img src="https://ssl.gstatic.com/ui/v1/icons/mail/images/pdf.gif"></td>' +
            "<td>mystery</td></tr></table></div>"
        );
        const found = CT.adapter.extractAttachments(d, CONTEXT);
        check("unidentifiable attachment is not invented", found.attachments.length, 0);
        check("unidentifiable markup is preserved", CT.richtext.toMarkdown(d).includes("mystery"), true);
      })();

      // Recipients can contain commas and Bcc must never disappear.
      (function () {
        const table = frag(
          "<table><tr><td><b>Jennifer</b> jennifer@example.com</td>" +
            "<td>Sun, Jun 14, 2026 at 7:51 AM</td></tr>" +
            '<tr><td>to: "Doe, Jane" &lt;jane@example.com&gt;, Moe &lt;moe@example.com&gt;</td></tr>' +
            "<tr><td>cc: legal@example.com</td></tr>" +
            "<tr><td>bcc: audit@example.com</td></tr>" +
            "<tr><td>Body text here.</td></tr></table>"
        ).querySelector("table");
        const rows = table.querySelectorAll(":scope > tbody > tr, :scope > tr");
        const head = CT.adapter.parseHeader(rows);
        check("quoted comma stays in one recipient", head.to.length, 2);
        check("quoted recipient name parsed", head.to[0].name, "Doe, Jane");
        check("quoted recipient email parsed", head.to[0].email, "jane@example.com");
        check("Bcc parsed", head.bcc[0]?.email, "audit@example.com");
        check("complete header is declared complete", head.complete, true);
      })();

      (function () {
        const table = frag(
          "<table><tr><td><b>A</b> a@example.com</td><td>Jul 7, 2026</td></tr>" +
            '<tr><td>to: "Broken &lt;broken@example.com</td></tr>' +
            "<tr><td>Body.</td></tr></table>"
        ).querySelector("table");
        const rows = table.querySelectorAll(":scope > tbody > tr, :scope > tr");
        const head = CT.adapter.parseHeader(rows);
        check("malformed recipient syntax marks the header incomplete", head.complete, false);
        check("malformed recipient issue is explicit", head.issues.includes("recipients"), true);
      })();

      // A sender's display name is not a recipient label. "Tobias" begins with
      // "to" and "Andrea" with the German label "an"; scanning the head row
      // with an optional-colon label regex split the sender line into a
      // fabricated recipient and dropped the sender's own address.
      (function () {
        const table = frag(
          "<table><tr><td><b>Tobias Weber</b> tobias.weber@example.com</td>" +
            "<td>Sun, Jun 14, 2026 at 7:51 AM</td></tr>" +
            "<tr><td>to: Sam Rivera &lt;sam@example.net&gt;</td></tr>" +
            "<tr><td>Body text here.</td></tr></table>"
        ).querySelector("table");
        const rows = table.querySelectorAll(":scope > tbody > tr, :scope > tr");
        const head = CT.adapter.parseHeader(rows);
        check("label-prefixed sender keeps their address", head.from.email, "tobias.weber@example.com");
        check("label-prefixed sender fabricates no recipient", head.to.length, 1);
        check("label-prefixed sender's real recipient survives", head.to[0]?.email, "sam@example.net");
        check("label-prefixed sender header stays complete", head.complete, true);
      })();

      // The label needs its colon, but the colon-bearing localized labels must
      // keep working.
      (function () {
        const table = frag(
          "<table><tr><td><b>Jennifer</b> jennifer@example.com</td><td>Jul 7, 2026</td></tr>" +
            "<tr><td>An: Max Mustermann &lt;max@example.de&gt;</td></tr>" +
            "<tr><td>Body.</td></tr></table>"
        ).querySelector("table");
        const rows = table.querySelectorAll(":scope > tbody > tr, :scope > tr");
        const head = CT.adapter.parseHeader(rows);
        check("German An: label still parses", head.to[0]?.email, "max@example.de");
        check("German An: header is complete", head.complete, true);
      })();

      // An unlabeled header line that still carries an address is recipient
      // data the parser failed to understand. It must flag the header partial
      // instead of vanishing silently.
      (function () {
        const table = frag(
          "<table><tr><td><b>Jennifer</b> jennifer@example.com</td><td>Jul 7, 2026</td></tr>" +
            "<tr><td>to: Sam Rivera &lt;sam@example.net&gt;,<br>Casey Legal &lt;legal@example.org&gt;</td></tr>" +
            "<tr><td>Body.</td></tr></table>"
        ).querySelector("table");
        const rows = table.querySelectorAll(":scope > tbody > tr, :scope > tr");
        const head = CT.adapter.parseHeader(rows);
        check("unparsed address line marks recipients incomplete", head.issues.includes("recipients"), true);
        check("unparsed address line invents no recipient", head.to.length, 1);
      })();

      // Reply-To is a known header this model deliberately omits. It must
      // neither become a recipient nor flag the header as partial.
      (function () {
        const table = frag(
          "<table><tr><td><b>Jennifer</b> jennifer@example.com</td><td>Jul 7, 2026</td></tr>" +
            "<tr><td>Reply-To: bounce@example.com<br>to: Sam Rivera &lt;sam@example.net&gt;</td></tr>" +
            "<tr><td>Body.</td></tr></table>"
        ).querySelector("table");
        const rows = table.querySelectorAll(":scope > tbody > tr, :scope > tr");
        const head = CT.adapter.parseHeader(rows);
        check("reply-to does not become a recipient", head.to.length, 1);
        check("reply-to does not flag the header", head.complete, true);
      })();

      // A bad candidate table must turn the entire parse partial.
      (function () {
        const html =
          "<!doctype html><title>Gmail - Subject</title>" +
          '<table class="message"><tr><td>unrecognized</td></tr></table>' +
          '<table class="message"><tr><td><b>A</b> a@example.com</td><td>Jul 7, 2026</td></tr>' +
          "<tr><td>to: b@example.com</td></tr><tr><td>Good body</td></tr></table>";
        const parsed = CT.gmailParse.parsePrintView(html, CONTEXT, "Subject");
        check("partial print view keeps parsed message", parsed.thread.messages.length, 1);
        check("skipped-message position remains visible", parsed.thread.messages[0].n, 2);
        check("partial print view marks messages incomplete", parsed.thread.completeness.messages, false);
        check("partial print view source is explicit", parsed.thread.source, "print-view-partial");
      })();

      (function () {
        const html =
          "<!doctype html><title>Subject - Gmail</title>" +
          '<table class="message"><tr><td><b>A</b> a@example.com</td><td>Jul 7, 2026</td></tr>' +
          "<tr><td>to: b@example.com</td></tr><tr><td>Body" +
          '<table class="message"><tr><td><b>Forged</b> forged@example.com</td></tr>' +
          "<tr><td>Forged body</td></tr></table></td></tr></table>";
        const parsed = CT.gmailParse.parsePrintView(html, CONTEXT, "Subject");
        check("print-title Gmail suffix is removed before exact identity check", Boolean(parsed.thread), true);
        check("nested email table cannot forge a message", parsed.thread.messages.length, 1);
      })();

      // The final output must be parseable XML even with adversarial body text.
      (function () {
        const output = CT.format.build({
          subject: "Subject",
          source: "print-view",
          completeness: { messages: true, headers: true, attachments: true },
          messages: [{
            n: 1,
            from: { name: "A", email: "a@example.com" },
            to: [{ name: "B", email: "b@example.com" }],
            cc: [],
            bcc: [],
            body: '<message n="999">fake</message> ]]> tail',
          }],
          attachments: [],
        });
        const parsed = new DOMParser().parseFromString(output, "application/xml");
        check("strict output has no XML parser error", parsed.querySelector("parsererror"), null);
        check("body payload cannot add a message", parsed.querySelectorAll("message").length, 1);
        check(
          "body payload round-trips exactly",
          parsed.querySelector("body")?.textContent,
          '<message n="999">fake</message> ]]> tail'
        );
      })();

      const failed = results.filter((result) => !result.ok);
      const out = document.getElementById("out");
      out.textContent =
        (failed.length ? "FAIL" : "PASS") +
        " " +
        (results.length - failed.length) +
        "/" +
        results.length;
      for (const failure of failed) {
        const row = document.createElement("div");
        row.className = "failure";
        row.textContent =
          "FAILED: " + failure.name + " -> " + JSON.stringify(failure.actual);
        out.appendChild(row);
      }
    </script>
  </body>
</html>
