<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title description">
  <title id="title">Install, copy, and paste a Gmail thread into an LLM</title>
  <desc id="description">Three evenly spaced product views show the extension in Chrome, its exact controls beside a fictional Gmail thread, and the copied thread pasted into an LLM prompt with Command-V or Control-V.</desc>

  <rect width="1400" height="560" fill="#f4f1ea"/>
  <circle cx="1345" cy="4" r="190" fill="#c94735" opacity="0.08"/>

  <text x="64" y="60" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="760" fill="#17191c">Install. Copy. Paste.</text>
  <text x="66" y="96" font-family="Inter, Arial, sans-serif" font-size="19" fill="#626873">A simple workflow with the controls you actually use.</text>

  <!-- 01 · Install -->
  <g transform="translate(64 125)" font-family="Inter, Arial, sans-serif">
    <rect width="392" height="350" rx="28" fill="#ffffff" stroke="#dedbd5" stroke-width="2"/>
    <rect x="24" y="20" width="48" height="30" rx="15" fill="#c94735"/>
    <text x="48" y="41" text-anchor="middle" font-size="15" font-weight="750" fill="#ffffff">01</text>
    <text x="88" y="44" font-size="24" font-weight="760" fill="#17191c">Install in Chrome</text>

    <g transform="translate(24 72)">
      <rect width="344" height="190" rx="17" fill="#ffffff" stroke="#cfd2d7" stroke-width="2"/>
      <path d="M17 0h310a17 17 0 0 1 17 17v25H0V17A17 17 0 0 1 17 0z" fill="#eef0f2"/>
      <circle cx="18" cy="21" r="5" fill="#ff5f57"/>
      <circle cx="34" cy="21" r="5" fill="#febc2e"/>
      <circle cx="50" cy="21" r="5" fill="#28c840"/>

      <g transform="translate(65 8) scale(.78)">
        <circle cx="16" cy="16" r="15" fill="#ea4335"/>
        <path d="M16 16h15A15 15 0 0 1 9 29z" fill="#fbbc04"/>
        <path d="M16 16L9 29A15 15 0 0 1 3 8h17z" fill="#34a853"/>
        <circle cx="16" cy="16" r="7" fill="#4285f4" stroke="#ffffff" stroke-width="2"/>
      </g>
      <rect x="94" y="11" width="170" height="19" rx="9.5" fill="#ffffff"/>
      <text x="106" y="25" font-size="10" fill="#7c828b">chromewebstore.google.com</text>

      <image x="24" y="67" width="88" height="88" href="icon128.png"/>
      <text x="126" y="82" font-size="17" font-weight="750" fill="#17191c">Copy Gmail Thread</text>
      <text x="126" y="104" font-size="17" font-weight="750" fill="#17191c">for AI</text>
      <text x="126" y="130" font-size="12" fill="#747a84">Chrome extension</text>
      <rect x="222" y="145" width="102" height="34" rx="17" fill="#1a73e8"/>
      <text x="273" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Add to Chrome</text>
    </g>

    <text x="196" y="314" text-anchor="middle" font-size="17" fill="#626873">Add it once. Keep using your Gmail tab.</text>
  </g>

  <!-- 02 · Copy -->
  <g transform="translate(504 125)" font-family="Inter, Arial, sans-serif">
    <rect width="392" height="350" rx="28" fill="#ffffff" stroke="#dedbd5" stroke-width="2"/>
    <rect x="24" y="20" width="48" height="30" rx="15" fill="#c94735"/>
    <text x="48" y="41" text-anchor="middle" font-size="15" font-weight="750" fill="#ffffff">02</text>
    <text x="88" y="44" font-size="24" font-weight="760" fill="#17191c">Copy the thread</text>

    <g transform="translate(24 72)">
      <rect width="344" height="190" rx="17" fill="#ffffff" stroke="#cfd2d7" stroke-width="2"/>
      <path d="M17 0h310a17 17 0 0 1 17 17v34H0V17A17 17 0 0 1 17 0z" fill="#eef0f2"/>
      <circle cx="18" cy="25" r="5" fill="#ff5f57"/>
      <circle cx="34" cy="25" r="5" fill="#febc2e"/>
      <circle cx="50" cy="25" r="5" fill="#28c840"/>
      <rect x="68" y="14" width="216" height="20" rx="10" fill="#ffffff"/>
      <text x="82" y="28" font-size="10" fill="#7c828b">mail.google.com/mail/u/0/#inbox/thread</text>

      <circle cx="32" cy="87" r="20" fill="#c94735"/>
      <text x="66" y="77" font-size="15" font-weight="750" fill="#2b2e33">Maya Chen</text>
      <text x="66" y="98" font-size="12" fill="#6f7580">Q3 launch plan · 3 messages</text>
      <rect x="66" y="116" width="235" height="7" rx="3.5" fill="#b7bbc1"/>
      <rect x="66" y="132" width="182" height="7" rx="3.5" fill="#d0d3d7"/>

      <!-- Captured from the actual in-page extension controls -->
      <image x="0" y="162" width="344" height="28" href="controls.png"/>
    </g>

    <text x="196" y="314" text-anchor="middle" font-size="17" fill="#626873">Use either action beside the conversation.</text>
  </g>

  <!-- 03 · Paste -->
  <g transform="translate(944 125)" font-family="Inter, Arial, sans-serif">
    <rect width="392" height="350" rx="28" fill="#ffffff" stroke="#dedbd5" stroke-width="2"/>
    <rect x="24" y="20" width="48" height="30" rx="15" fill="#c94735"/>
    <text x="48" y="41" text-anchor="middle" font-size="15" font-weight="750" fill="#ffffff">03</text>
    <text x="88" y="44" font-size="24" font-weight="760" fill="#17191c">Paste into your LLM</text>

    <g transform="translate(24 72)">
      <rect width="344" height="190" rx="17" fill="#17191c"/>
      <path d="M17 0h310a17 17 0 0 1 17 17v34H0V17A17 17 0 0 1 17 0z" fill="#272b30"/>
      <path d="M21 14l3.5 8 8 3.5-8 3.5-3.5 8-3.5-8-8-3.5 8-3.5z" fill="#ff715d"/>
      <text x="42" y="30" font-size="13" font-weight="700" fill="#f5f4ef">New chat</text>

      <text x="20" y="79" font-size="12" font-weight="700" fill="#c7cbd1">Paste into the prompt</text>
      <g transform="translate(235 60)">
        <rect width="40" height="29" rx="7" fill="#ffffff"/>
        <text x="20" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#17191c">⌘</text>
        <text x="46" y="20" font-size="13" font-weight="700" fill="#c7cbd1">+</text>
        <rect x="59" width="40" height="29" rx="7" fill="#ffffff"/>
        <text x="79" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#17191c">V</text>
      </g>

      <rect x="20" y="99" width="304" height="68" rx="15" fill="#ffffff"/>
      <text x="36" y="122" font-family="SFMono-Regular, Consolas, monospace" font-size="11" fill="#34383e">&lt;email_thread format_version="3"&gt;</text>
      <rect x="36" y="135" width="201" height="6" rx="3" fill="#8c929a"/>
      <rect x="36" y="148" width="151" height="5" rx="2.5" fill="#c0c4c9"/>
      <circle cx="298" cy="133" r="15" fill="#17191c"/>
      <path d="M292 135l6-6 6 6m-6-6v11" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="196" y="314" text-anchor="middle" font-size="17" fill="#626873">⌘V on macOS · Ctrl+V on Windows</text>
  </g>
</svg>
