<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title description">
  <title id="title">Install, copy, and paste a Gmail thread into an LLM</title>
  <desc id="description">A three-step workflow showing installation in Chrome, copying the open Gmail conversation, and pasting structured context into an LLM.</desc>

  <rect width="1400" height="560" fill="#f4f1ea"/>
  <circle cx="1325" cy="42" r="250" fill="#c94735" opacity="0.10"/>
  <circle cx="44" cy="590" r="230" fill="#111417" opacity="0.05"/>

  <text x="70" y="76" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="760" fill="#17191c">From Gmail to useful AI context in three steps.</text>
  <text x="72" y="112" font-family="Inter, Arial, sans-serif" font-size="20" fill="#626873">The extension handles the structure. You choose what to paste and where.</text>

  <!-- Step 1 -->
  <g transform="translate(70 150)">
    <rect width="380" height="310" rx="30" fill="#ffffff" stroke="#dedbd5" stroke-width="2"/>
    <rect x="26" y="24" width="50" height="32" rx="16" fill="#c94735"/>
    <text x="51" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#ffffff">01</text>

    <g transform="translate(132 38)">
      <rect x="0" y="0" width="116" height="90" rx="16" fill="#f1f2f3" stroke="#c9ccd1" stroke-width="2"/>
      <circle cx="18" cy="16" r="5" fill="#ef5b4d"/>
      <circle cx="34" cy="16" r="5" fill="#efb337"/>
      <circle cx="50" cy="16" r="5" fill="#35b85b"/>
      <rect x="15" y="32" width="86" height="43" rx="9" fill="#17191c"/>
      <rect x="38" y="43" width="27" height="27" rx="6" fill="none" stroke="#8f949b" stroke-width="4"/>
      <rect x="54" y="52" width="29" height="29" rx="6" fill="#17191c" stroke="#ffffff" stroke-width="4"/>
      <path d="M92 43v22M81 54h22" stroke="#c94735" stroke-width="5" stroke-linecap="round"/>
    </g>

    <text x="28" y="172" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="760" fill="#17191c">Install in Chrome</text>
    <text x="28" y="208" font-family="Inter, Arial, sans-serif" font-size="18" fill="#626873">Add the extension once.</text>
    <text x="28" y="237" font-family="Inter, Arial, sans-serif" font-size="18" fill="#626873">No Google OAuth or new account.</text>
    <rect x="28" y="265" width="205" height="28" rx="14" fill="#17191c" opacity="0.08"/>
    <text x="42" y="285" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#4f555f">CHROME EXTENSION</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(466 292)">
    <path d="M0 0h34" stroke="#c94735" stroke-width="5" stroke-linecap="round"/>
    <path d="M24 -10l12 10-12 10" fill="none" stroke="#c94735" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 2 -->
  <g transform="translate(510 150)">
    <rect width="380" height="310" rx="30" fill="#17191c"/>
    <rect x="26" y="24" width="50" height="32" rx="16" fill="#ff715d"/>
    <text x="51" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#17191c">02</text>

    <g transform="translate(125 35)">
      <rect x="0" y="8" width="130" height="92" rx="17" fill="#ffffff"/>
      <path d="M15 31l50 39 50-39" fill="none" stroke="#c94735" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 30h100v55H15z" fill="none" stroke="#d8dbe0" stroke-width="4"/>
      <rect x="65" y="62" width="66" height="52" rx="13" fill="#2a2e33" stroke="#ffffff" stroke-width="3"/>
      <rect x="82" y="73" width="27" height="27" rx="6" fill="none" stroke="#969ba3" stroke-width="4"/>
      <rect x="96" y="82" width="29" height="29" rx="6" fill="#2a2e33" stroke="#ffffff" stroke-width="4"/>
    </g>

    <text x="28" y="172" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="760" fill="#ffffff">Copy the thread</text>
    <text x="28" y="208" font-family="Inter, Arial, sans-serif" font-size="18" fill="#c7cbd1">Open a Gmail conversation.</text>
    <text x="28" y="237" font-family="Inter, Arial, sans-serif" font-size="18" fill="#c7cbd1">Click Copy thread—or use a shortcut.</text>
    <rect x="28" y="265" width="204" height="28" rx="14" fill="#ffffff" opacity="0.12"/>
    <text x="42" y="285" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#f5f4ef">STRUCTURED OUTPUT</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(906 292)">
    <path d="M0 0h34" stroke="#c94735" stroke-width="5" stroke-linecap="round"/>
    <path d="M24 -10l12 10-12 10" fill="none" stroke="#c94735" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 3 -->
  <g transform="translate(950 150)">
    <rect width="380" height="310" rx="30" fill="#ffffff" stroke="#dedbd5" stroke-width="2"/>
    <rect x="26" y="24" width="50" height="32" rx="16" fill="#c94735"/>
    <text x="51" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#ffffff">03</text>

    <g transform="translate(127 35)">
      <path d="M12 10h112a16 16 0 0 1 16 16v60a16 16 0 0 1-16 16H63l-28 22 7-22H12A16 16 0 0 1-4 86V26A16 16 0 0 1 12 10z" fill="#f1f2f3" stroke="#c9ccd1" stroke-width="2"/>
      <rect x="20" y="35" width="72" height="8" rx="4" fill="#17191c"/>
      <rect x="20" y="53" width="95" height="7" rx="3.5" fill="#777d86"/>
      <rect x="20" y="70" width="78" height="7" rx="3.5" fill="#9ba0a7"/>
      <path d="M117 16l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#c94735"/>
    </g>

    <text x="28" y="172" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="760" fill="#17191c">Paste into your LLM</text>
    <text x="28" y="208" font-family="Inter, Arial, sans-serif" font-size="18" fill="#626873">Bring complete, attributed context</text>
    <text x="28" y="237" font-family="Inter, Arial, sans-serif" font-size="18" fill="#626873">to the AI tool you choose.</text>
    <rect x="28" y="265" width="218" height="28" rx="14" fill="#17191c" opacity="0.08"/>
    <text x="42" y="285" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#4f555f">YOU CONTROL THE PASTE</text>
  </g>

  <rect x="475" y="496" width="450" height="40" rx="20" fill="#17191c"/>
  <text x="700" y="522" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#f7f6f0">Local processing · No analytics · No extension account</text>
</svg>
