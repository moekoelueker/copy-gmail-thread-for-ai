<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title description">
  <title id="title">Install in Chrome, copy the open Gmail thread, and paste it into an LLM</title>
  <desc id="description">A literal three-step product storyboard using the extension's production icon and in-page Gmail controls, followed by the Command-V or Control-V paste action in an LLM prompt field.</desc>

  <rect width="1400" height="560" fill="#f4f1ea"/>
  <circle cx="1330" cy="24" r="235" fill="#c94735" opacity="0.10"/>
  <circle cx="25" cy="585" r="210" fill="#111417" opacity="0.05"/>

  <text x="50" y="70" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="760" fill="#17191c">Install. Copy. Paste.</text>
  <text x="52" y="108" font-family="Inter, Arial, sans-serif" font-size="20" fill="#626873">The same three actions—and the same controls—you use in the product.</text>

  <!-- Step 1: Chrome install -->
  <g transform="translate(45 140)" font-family="Inter, Arial, sans-serif">
    <rect width="405" height="330" rx="28" fill="#ffffff" stroke="#dedbd5" stroke-width="2"/>
    <rect x="24" y="22" width="48" height="30" rx="15" fill="#c94735"/>
    <text x="48" y="43" text-anchor="middle" font-size="15" font-weight="750" fill="#ffffff">01</text>

    <g transform="translate(24 67)">
      <rect width="357" height="151" rx="15" fill="#ffffff" stroke="#cfd2d7" stroke-width="2"/>
      <path d="M15 0h327a15 15 0 0 1 15 15v23H0V15A15 15 0 0 1 15 0z" fill="#eef0f2"/>
      <circle cx="17" cy="19" r="5" fill="#ff5f57"/>
      <circle cx="33" cy="19" r="5" fill="#febc2e"/>
      <circle cx="49" cy="19" r="5" fill="#28c840"/>

      <!-- Chrome mark in the browser toolbar -->
      <g transform="translate(64 7) scale(.74)">
        <circle cx="16" cy="16" r="15" fill="#ea4335"/>
        <path d="M16 16h15A15 15 0 0 1 9 29z" fill="#fbbc04"/>
        <path d="M16 16L9 29A15 15 0 0 1 3 8h17z" fill="#34a853"/>
        <circle cx="16" cy="16" r="7" fill="#4285f4" stroke="#ffffff" stroke-width="2"/>
      </g>
      <rect x="92" y="10" width="166" height="18" rx="9" fill="#ffffff"/>
      <text x="105" y="23" font-size="10" fill="#7c828b">chromewebstore.google.com</text>

      <image x="19" y="53" width="75" height="75" href="icon128.png"/>
      <text x="108" y="70" font-size="17" font-weight="750" fill="#17191c">Copy Gmail Thread</text>
      <text x="108" y="92" font-size="17" font-weight="750" fill="#17191c">for AI</text>
      <text x="108" y="117" font-size="12" fill="#747a84">Chrome extension</text>
      <rect x="247" y="72" width="94" height="36" rx="18" fill="#1a73e8"/>
      <text x="294" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Add to Chrome</text>
    </g>

    <text x="25" y="259" font-size="28" font-weight="760" fill="#17191c">Install in Chrome</text>
    <text x="25" y="289" font-size="17" fill="#626873">Add the extension and keep using Gmail</text>
    <text x="25" y="313" font-size="17" fill="#626873">with your existing signed-in browser tab.</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M463 302h20m-9-9 10 9-10 9" fill="none" stroke="#c94735" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2: exact Gmail controls beside a fictional thread -->
  <g transform="translate(500 140)" font-family="Inter, Arial, sans-serif">
    <rect width="400" height="330" rx="28" fill="#ffffff" stroke="#dedbd5" stroke-width="2"/>
    <rect x="24" y="22" width="48" height="30" rx="15" fill="#c94735"/>
    <text x="48" y="43" text-anchor="middle" font-size="15" font-weight="750" fill="#ffffff">02</text>

    <g transform="translate(14 67)">
      <rect width="372" height="151" rx="15" fill="#ffffff" stroke="#cfd2d7" stroke-width="2"/>
      <path d="M15 0h342a15 15 0 0 1 15 15v31H0V15A15 15 0 0 1 15 0z" fill="#eef0f2"/>
      <circle cx="17" cy="22" r="5" fill="#ff5f57"/>
      <circle cx="33" cy="22" r="5" fill="#febc2e"/>
      <circle cx="49" cy="22" r="5" fill="#28c840"/>
      <rect x="70" y="12" width="220" height="20" rx="10" fill="#ffffff"/>
      <text x="85" y="26" font-size="10" fill="#7c828b">mail.google.com/mail/u/0/#inbox/thread</text>

      <circle cx="31" cy="78" r="18" fill="#c94735"/>
      <text x="58" y="70" font-size="14" font-weight="750" fill="#2b2e33">Maya Chen</text>
      <text x="58" y="89" font-size="12" fill="#6f7580">Q3 launch plan · 3 messages</text>
      <rect x="58" y="101" width="248" height="7" rx="3.5" fill="#b7bbc1"/>
      <rect x="58" y="116" width="198" height="7" rx="3.5" fill="#d0d3d7"/>

      <!-- Captured from the actual in-page extension controls -->
      <image x="0" y="121" width="372" height="30" href="controls.png"/>
    </g>

    <text x="25" y="259" font-size="28" font-weight="760" fill="#17191c">Copy the open thread</text>
    <text x="25" y="289" font-size="17" fill="#626873">Choose Copy thread or Copy + save files</text>
    <text x="25" y="313" font-size="17" fill="#626873">right beside the Gmail conversation.</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M913 302h20m-9-9 10 9-10 9" fill="none" stroke="#c94735" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3: paste into a real prompt field -->
  <g transform="translate(950 140)" font-family="Inter, Arial, sans-serif">
    <rect width="405" height="330" rx="28" fill="#17191c"/>
    <rect x="24" y="22" width="48" height="30" rx="15" fill="#ff715d"/>
    <text x="48" y="43" text-anchor="middle" font-size="15" font-weight="750" fill="#17191c">03</text>

    <g transform="translate(24 67)">
      <rect width="357" height="151" rx="15" fill="#f7f7f6"/>
      <path d="M15 0h327a15 15 0 0 1 15 15v31H0V15A15 15 0 0 1 15 0z" fill="#e9ebee"/>
      <path d="M20 14l3.5 8 8 3.5-8 3.5-3.5 8-3.5-8-8-3.5 8-3.5z" fill="#c94735"/>
      <text x="40" y="29" font-size="13" font-weight="700" fill="#3e4248">New chat</text>
      <text x="18" y="67" font-size="11" font-weight="700" fill="#626873">Paste the copied thread into the prompt</text>

      <rect x="18" y="77" width="321" height="57" rx="14" fill="#ffffff" stroke="#c7cbd1" stroke-width="2"/>
      <text x="34" y="99" font-family="SFMono-Regular, Consolas, monospace" font-size="11" fill="#34383e">&lt;email_thread format_version="3"&gt;</text>
      <rect x="34" y="110" width="202" height="6" rx="3" fill="#8c929a"/>
      <rect x="34" y="121" width="154" height="5" rx="2.5" fill="#c0c4c9"/>
      <circle cx="315" cy="106" r="14" fill="#17191c"/>
      <path d="M309 108l6-6 6 6m-6-6v10" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(238 49)">
        <rect width="39" height="27" rx="7" fill="#17191c"/>
        <text x="19.5" y="19" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">⌘</text>
        <text x="45" y="19" font-size="13" font-weight="700" fill="#626873">+</text>
        <rect x="58" width="39" height="27" rx="7" fill="#17191c"/>
        <text x="77.5" y="19" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">V</text>
      </g>
    </g>

    <text x="25" y="259" font-size="28" font-weight="760" fill="#ffffff">Paste into your LLM</text>
    <text x="25" y="289" font-size="17" fill="#c7cbd1">Press ⌘V on macOS or Ctrl+V on Windows.</text>
    <text x="25" y="313" font-size="17" fill="#c7cbd1">You choose the AI tool and when to send.</text>
  </g>

  <rect x="470" y="499" width="460" height="38" rx="19" fill="#17191c"/>
  <text x="700" y="524" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#f7f6f0">Local processing · No analytics · No extension account</text>
</svg>
